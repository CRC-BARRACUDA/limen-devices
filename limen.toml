[module]
name = "devices"
version = "0.2.0"
language = "native"
entry = "devices"
abi = "native"
description = "List devices on THIS machine across buses: USB, PCI, monitors (EDID), disks, network, Bluetooth."
authors = ["Limen"]
repo = "CRC-BARRACUDA/limen-devices"

[provides]
capabilities = ["devices.local"]

# Reads the kernel journal (spawns `journalctl`) for device history on Linux.
[permissions]
subprocess = true
