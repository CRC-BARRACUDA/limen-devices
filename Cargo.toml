# Standalone package (it lives inside the Limen repo tree but is its own module).
[workspace]

[package]
name = "local-devices"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lists devices connected to THIS machine (USB history)."
repository = "https://github.com/CRC-BARRACUDA/limen-local-devices"

[lib]
name = "local_devices"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
limen-sdk-rust = { git = "https://github.com/CRC-BARRACUDA/Limen.git" }

# Windows-only: read the registry for the full "ever connected" device history.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
